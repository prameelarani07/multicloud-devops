name: Deploy CloudPilot to AWS S3

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy-s3.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy website to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

              - name: Check GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | awk '{print $0 substr("==",1,(4-length($0)%4)%4)}' | base64 -d)

          echo "$PAYLOAD" | jq '{iss, aud, sub}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload homepage to S3
        run: |
          aws s3 cp index.html s3://cloudpilot-website-prameelarani07/index.html \
            --content-type "text/html"

      - name: Upload website assets to S3
        run: |
          aws s3 sync assets/ s3://cloudpilot-website-prameelarani07/assets/ --delete